<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Login Page</title></head>
<body>
  <h1 id="title">Login Page</h1>
  <form id="login-form" onsubmit="return doLogin(event)">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" data-testid="username">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" data-testid="password">
    <button id="login-btn" class="btn primary" type="submit">Login</button>
  </form>
  <div id="flash" class="flash" style="display:none"></div>
  <a id="help-link" href="form.html">Help</a>
  <script>
    function doLogin(e) {
      e.preventDefault();
      var u = document.getElementById("username").value;
      var p = document.getElementById("password").value;
      var flash = document.getElementById("flash");
      flash.style.display = "block";
      if (u === "tomsmith" && p === "SuperSecretPassword!") {
        flash.className = "flash success";
        flash.textContent = "You logged into a secure area!";
      } else {
        flash.className = "flash error";
        flash.textContent = "Your username or password is invalid!";
      }
      return false;
    }
  </script>
</body>
</html>
