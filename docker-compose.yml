services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: exchange
      POSTGRES_PASSWORD: exchange
      POSTGRES_DB: exchange
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exchange"]
      interval: 2s
      timeout: 3s
      retries: 20

  exchange:
    build: .
    environment:
      EXCHANGE_DATABASE_URL: postgresql+asyncpg://exchange:exchange@db:5432/exchange
      EXCHANGE_JWT_SECRET: docker-secret-change-me-at-least-32-bytes
      EXCHANGE_CHAOS_RATE: ${EXCHANGE_CHAOS_RATE:-0}
      EXCHANGE_KAFKA_BOOTSTRAP: redpanda:9092
      EXCHANGE_RABBITMQ_URL: amqp://exchange:exchange@rabbitmq:5672/
      EXCHANGE_PRICE_FEED_URL: http://toxiproxy:8666
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy

  # Брокер событий, совместимый с Kafka: стенд пишет в orders.events,
  # тесты читают с хоста через localhost:19092
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --mode dev-container
      - --smp 1
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"

  # Очередь депозитов: тесты кладут сообщения в deposits, стенд зачисляет.
  # Веб-консоль: http://localhost:15672 (exchange / exchange)
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: exchange
      RABBITMQ_DEFAULT_PASS: exchange
    ports:
      - "5672:5672"
      - "15672:15672"

  # Внешний провайдер цен для MARKET-ордеров — в тестах это WireMock.
  # Цены по умолчанию — wiremock/mappings; стабы тестов: http://localhost:8089/__admin
  price-feed:
    image: wiremock/wiremock:3.9.1
    # {{now}} и другие шаблоны в ответах работают во всех стабах
    command: ["--global-response-templating"]
    volumes:
      - ./wiremock:/home/wiremock
    ports:
      - "8089:8080"

  # Сеть между стендом и провайдером цен: стенд → toxiproxy:8666 → price-feed:8080.
  # Задержки и обрывы: HTTP API http://localhost:8474 (прокси price_feed)
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./toxiproxy:/config
    ports:
      - "8474:8474"
    depends_on:
      - price-feed

  # Второй экземпляр стенда, имитирует общий stage: своя база, свой секрет,
  # немного нестабильности. Запуск: docker compose --profile stage up -d
  db-stage:
    image: postgres:16-alpine
    profiles: ["stage"]
    environment:
      POSTGRES_USER: exchange
      POSTGRES_PASSWORD: exchange
      POSTGRES_DB: exchange
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exchange"]
      interval: 2s
      timeout: 3s
      retries: 20

  exchange-stage:
    build: .
    profiles: ["stage"]
    environment:
      EXCHANGE_DATABASE_URL: postgresql+asyncpg://exchange:exchange@db-stage:5432/exchange
      EXCHANGE_JWT_SECRET: stage-secret-not-the-same-as-docker-32b
      EXCHANGE_CHAOS_RATE: ${EXCHANGE_STAGE_CHAOS_RATE:-0.05}
    ports:
      - "8081:8000"
    depends_on:
      db-stage:
        condition: service_healthy
