services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: exchange
      POSTGRES_PASSWORD: exchange
      POSTGRES_DB: exchange
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exchange"]
      interval: 2s
      timeout: 3s
      retries: 20

  exchange:
    build: .
    environment:
      EXCHANGE_DATABASE_URL: postgresql+asyncpg://exchange:exchange@db:5432/exchange
      EXCHANGE_JWT_SECRET: docker-secret-change-me-at-least-32-bytes
      EXCHANGE_CHAOS_RATE: ${EXCHANGE_CHAOS_RATE:-0}
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy
