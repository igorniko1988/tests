[project]
name = "exchange-qa"
version = "0.1.0"
description = "Мини-биржа на FastAPI и фреймворк API-тестов к ней"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
# Зависимости стенда: только они попадают в Docker-образ сервиса
service = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "email-validator>=2.3.0",
]
# Зависимости фреймворка тестов
tests = [
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "allure-pytest>=2.13",
    "tenacity>=9.0",
    "faker>=30.0",
    "pytest-xdist>=3.8.0",
]
dev = [
    { include-group = "service" },
    { include-group = "tests" },
    "ruff>=0.8",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --alluredir=allure-results"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "smoke: быстрые проверки, что стенд жив",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
