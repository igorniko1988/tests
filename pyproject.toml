[project]
name = "exchange-qa"
version = "0.1.0"
description = "Мини-биржа на FastAPI и фреймворк API-тестов к ней"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
# Зависимости стенда: только они попадают в Docker-образ сервиса
service = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "email-validator>=2.3.0",
]
# Зависимости фреймворка тестов
tests = [
    "pytest>=8.3",
    "playwright>=1.63.0",
    "pytest-playwright>=0.9.0",
    "requests>=2.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "faker>=30.0",
    "allure-pytest>=2.13",
]>=3.3.6",
    "hypothesis>=6.168.3",
    "playwright>=1.63.0",
    "pytest-playwright>=0.9.0",
]
dev = [
    { include-group = "service" },
    { include-group = "tests" },
    "ruff>=0.8",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# macOS 12: свежий Chromium от Playwright не ставится, поэтому используем установленный Chrome
addopts = "-ra --strict-markers --browser-channel chrome"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
